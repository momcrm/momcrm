name: Bug report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/momcrm/momcrm/issues) first to avoid duplicates.

        **Security issues should not be reported here.** Use [private vulnerability reporting](https://github.com/momcrm/momcrm/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MomCRM version or commit
      placeholder: e.g. v1.0.0 or a92974f
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: e.g. 8.4.1
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: e.g. MySQL 8.4
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output from storage/logs/laravel.log or the browser console. Remove any secrets.
      render: shell
